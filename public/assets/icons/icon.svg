<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" stroke="rgba(255,255,255,0.12)" stroke-width="4" fill="none" />
  
  <!-- Graduation Cap & School Emblem -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cap Top Diamond -->
    <path d="M256 128 L400 196 L256 264 L112 196 Z" />
    <!-- Cap Under Skullcap -->
    <path d="M168 226 L168 300 C168 340 344 340 344 300 L344 226 L256 268 Z" fill="rgba(255,255,255,0.92)" />
    <!-- Tassel -->
    <path d="M380 200 L400 240 L394 316 L384 316 L378 240 Z" fill="#fde047" />
    <circle cx="389" cy="324" r="9" fill="#fde047" />
  </g>
  
  <!-- Checkmark / Attendance Verification symbol below -->
  <g transform="translate(196, 332)">
    <circle cx="60" cy="40" r="38" fill="#10b981" />
    <path d="M48 40 L56 48 L72 32" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
